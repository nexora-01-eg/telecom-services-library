<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة إكس-أو</title>
  <link rel="stylesheet" href="xo.css">
</head>
<body>
  <div class="wrapper">
    <h1>لعبة إكس-أو ❌⭕</h1>
    <p class="status" id="status">دور اللاعب X</p>

    <div class="board" id="board">
      <button class="cell" data-i="0"></button>
      <button class="cell" data-i="1"></button>
      <button class="cell" data-i="2"></button>
      <button class="cell" data-i="3"></button>
      <button class="cell" data-i="4"></button>
      <button class="cell" data-i="5"></button>
      <button class="cell" data-i="6"></button>
      <button class="cell" data-i="7"></button>
      <button class="cell" data-i="8"></button>
    </div>

    <div class="controls">
      <button class="btn" id="newGame">لعبة جديدة</button>
      <button class="btn secondary" id="resetScores">تصفير النتائج</button>
    </div>

    <div class="scoreboard">
      <div class="score x-score">❌ X: <span id="scoreX">0</span></div>
      <div class="score">تعادل: <span id="scoreDraw">0</span></div>
      <div class="score o-score">⭕ O: <span id="scoreO">0</span></div>
    </div>
  </div>

  <script src="xo.js"></script>
</body>
</html>
